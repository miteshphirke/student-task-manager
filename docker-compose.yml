# ---------------------------------------------------------------------------
# Main docker-compose file: runs the Student Task Manager app together with
# Prometheus (metrics collection) and Grafana (dashboards).
#
# Local test:      docker-compose up --build
# On the Ubuntu VM: this same file is copied by Ansible and started there.
# ---------------------------------------------------------------------------
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-task-manager:latest
    container_name: student-task-manager
    ports:
      - "5000:5000"
    volumes:
      - task_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - web

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  task_data:
  prometheus_data:
  grafana_data:
