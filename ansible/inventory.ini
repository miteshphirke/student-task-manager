; ---------------------------------------------------------------------------
; Ansible inventory: lists the Ubuntu VM(s) to deploy to.
; Replace the IP address, user and key path with your own VM's details.
; ---------------------------------------------------------------------------
[app_servers]
192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
