# Prometheus scrape configuration.
# Tells Prometheus where to find metrics: our Flask app's /metrics endpoint.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "student-task-manager"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:5000"]   # "web" = the docker-compose service name of the Flask app

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
